<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css}">
    <title th:text="${note.title}"></title>
</head>
<body>
    <h1>Note editor</h1>
    <div>
        <form action="/note/edit" method="POST">
            <input type="hidden" name="id" th:value="${note.id}">
            Title: <input type="text" placeholder="Type name here ..." name="title" th:value="${note.title}"><br>
            <textarea placeholder="Type text here ..." name="content" th:text="${note.content}"></textarea><br>
            <input type="submit" value="Save">
        </form>
    </div>
</body>
</html>
