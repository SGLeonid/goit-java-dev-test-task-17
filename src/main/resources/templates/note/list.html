<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css}">
    <title>Document</title>
</head>
<body>
    <h1>Notes</h1>
    <form action="/note/list" method="GET">
        <input type="text" name="title" th:value="${search}">
        <button type="submit">Search</button>
    </form>
    <ul>
        <li th:each="note : ${notes}" th:if="${note != null}">
            <div>
                <h1><span th:text="${note.title}"></span></h1>
                <p><span th:text="${note.content}"></span></p>
                <form action="/note/edit" method="GET">
                    <input type="hidden" th:name="id" th:value="${note.id}">
                    <button type="submit">Edit</button>
                </form>
                <form th:action="@{/note/delete(id=${note.id})}" method="POST">
                    <button type="submit">Delete</button>
                </form>
            </div>
        </li>
    </ul>
    <form action="/note/create" method="POST">
        <button type="submit">Create new note</button>
    </form>
</body>
</html>
